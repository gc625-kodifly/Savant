  display-sink:
    image: ghcr.io/insight-platform/savant-adapters-deepstream:0.4.10-6.4
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/.docker.xauth:/tmp/.docker.xauth
    environment:
      - ZMQ_ENDPOINT=sub+connect:ipc:///tmp/zmq-sockets/output-video.ipc
      - DISPLAY
      - XAUTHORITY=/tmp/.docker.xauth
      - SYNC_OUTPUT=False
    entrypoint: /opt/savant/adapters/ds/sinks/display.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

