services:

  video-loop-source:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:0.4.10
    restart: unless-stopped
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - /home/gabriel/data/tennis_data/raw:/tmp/video-loop-source-downloads
    environment:
      - LOCATION=/tmp/video-loop-source-downloads/AO2017.mp4
      - DOWNLOAD_PATH=/tmp/video-loop-source-downloads
      - ZMQ_ENDPOINT=pub+connect:ipc:///tmp/zmq-sockets/input-video.ipc
      - SOURCE_ID=town-centre
      - SYNC_OUTPUT=True
    entrypoint: /opt/savant/adapters/gst/sources/video_loop.sh
    depends_on:
      module:
        condition: service_healthy

  sink-video-files:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:latest
    container_name: sink-video-files
    entrypoint: /opt/savant/adapters/gst/sinks/video_files.py
    environment:
      # Tell the adapter where to receive frames+meta from the module
      - ZMQ_ENDPOINT=sub+connect:ipc:///tmp/zmq-sockets/output-video.ipc
      # Where and how to store the files (using placeholders).
      - DIR_LOCATION=/path/to/output/%source_id-%src_filename
      # Zero chunk_size => split output only on EOS
      - CHUNK_SIZE=0
      # By default includes frames that have no objects
      - SKIP_FRAMES_WITHOUT_OBJECTS=False
    # Mount a local folder to write the output video chunks
    volumes:
      - ./output:/path/to/output
      # Named volume (or host path) for the Savant ZMQ sockets
      - zmq_sockets:/tmp/zmq-sockets
    depends_on:
      # If you have your Savant module service named "module"
      module:
        condition: service_healthy

